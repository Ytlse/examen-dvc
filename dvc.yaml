stages:
  processed:
    cmd: python src/data/01_processed_data.py
    deps:
    - data/raw_data/raw.csv
    - src/data/01_processed_data.py
    outs:
    - data/processed_data/X_test.csv
    - data/processed_data/X_train.csv
    - data/processed_data/y_test.csv
    - data/processed_data/y_train.csv
  scaled:
    cmd: python src/data/02_scaled_data.py
    deps:
    - data/processed_data/X_test.csv
    - data/processed_data/X_train.csv
    - src/data/02_scaled_data.py
    outs:
    - data/scaled_data/X_test_scaled.csv
    - data/scaled_data/X_train_scaled.csv
  gridsearch:
    cmd: python src/models/03_model_gridsearch.py
    deps:
    - data/processed_data/y_train.csv
    - data/scaled_data/X_train_scaled.csv
    - src/models/03_model_gridsearch.py
    outs:
    - models/gridsearch/xgboost_best_params.pkl
  fit:
    cmd: python src/models/04_model_fit.py
    deps:
    - data/processed_data/y_train.csv
    - data/scaled_data/X_train_scaled.csv
    - models/gridsearch/xgboost_best_params.pkl
    - src/models/04_model_fit.py
    outs:
    - models/last/xgboost_final_model.pkl
  evaluate:
    cmd: python src/models/05_evaluation.py
    deps:
    - data/processed_data/y_test.csv
    - data/scaled_data/X_test_scaled.csv
    - models/last/xgboost_final_model.pkl
    - src/models/05_evaluation.py
    outs:
    - data/predictions/y_pred.csv
    metrics:
    - metrics/scores.json:
        cache: false
